<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>요리 유학 일본어</title>
<style>
  :root{
    --bg:#0f1220; --panel:#1a1f35; --panel2:#232a45; --line:#2e3860;
    --txt:#eef1ff; --sub:#a6b0d8; --accent:#ff7a59; --accent2:#5b8cff;
    --green:#3ecf8e; --gold:#ffcf5c; --red:#ff6b6b; --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    font-family:"Segoe UI","Malgun Gothic","Yu Gothic",system-ui,sans-serif;
    background:var(--bg); color:var(--txt);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }
  .app{width:100%; max-width:520px; flex:1; display:flex; flex-direction:column; min-height:100vh}
  header{
    padding:18px 20px 14px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; background:linear-gradient(180deg,var(--bg),rgba(15,18,32,.85)); backdrop-filter:blur(6px); z-index:5;
  }
  header h1{font-size:18px; margin:0; letter-spacing:-.3px}
  header h1 span{color:var(--accent)}
  .streak{font-size:13px; color:var(--sub); background:var(--panel); padding:6px 12px; border-radius:20px; border:1px solid var(--line)}
  main{flex:1; padding:0 16px 90px; overflow-y:auto}
  .hide{display:none !important}

  /* cards / dashboard */
  .hero{background:linear-gradient(135deg,#2a2140,#1a1f35); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px}
  .hero p{margin:0 0 4px; color:var(--sub); font-size:13px}
  .hero h2{margin:0 0 14px; font-size:20px; line-height:1.35}
  .progressbar{height:10px; background:#0c0f1c; border-radius:20px; overflow:hidden; margin-top:8px}
  .progressbar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); border-radius:20px; transition:width .5s}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .tile{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; cursor:pointer; transition:.15s; text-align:left}
  .tile:active{transform:scale(.97)}
  .tile .emo{font-size:26px}
  .tile h3{margin:8px 0 2px; font-size:15px}
  .tile small{color:var(--sub); font-size:12px}
  .tile.wide{grid-column:1/-1; display:flex; align-items:center; gap:14px}
  .tile.wide .emo{font-size:30px}

  /* section header */
  .shead{display:flex; align-items:center; gap:12px; margin:6px 0 16px}
  .back{background:var(--panel); border:1px solid var(--line); color:var(--txt); width:38px; height:38px; border-radius:12px; font-size:18px; cursor:pointer}
  .shead h2{margin:0; font-size:18px}
  .shead small{color:var(--sub); display:block; font-size:12px; font-weight:normal}

  /* theme picker */
  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
  .chip{padding:8px 14px; border-radius:20px; background:var(--panel); border:1px solid var(--line); color:var(--sub); font-size:13px; cursor:pointer}
  .chip.on{background:var(--accent); color:#181018; border-color:var(--accent); font-weight:600}

  /* flashcard */
  .fc{perspective:1200px; margin-bottom:16px}
  .fc-inner{position:relative; width:100%; min-height:240px; transition:transform .5s; transform-style:preserve-3d; cursor:pointer}
  .fc.flipped .fc-inner{transform:rotateY(180deg)}
  .fc-face{position:absolute; inset:0; backface-visibility:hidden; background:var(--panel); border:1px solid var(--line); border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center}
  .fc-back{transform:rotateY(180deg)}
  .jp{font-size:40px; font-weight:700; margin:6px 0; line-height:1.3}
  .furi{font-size:15px; color:var(--accent2); margin-bottom:2px}
  .romaji{font-size:13px; color:var(--sub)}
  .ko{font-size:22px; margin:6px 0}
  .ex{font-size:14px; color:var(--sub); margin-top:14px; line-height:1.6; border-top:1px solid var(--line); padding-top:12px; width:100%}
  .ex b{color:var(--txt); font-weight:600}
  .tap-hint{position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:11px; color:var(--sub); opacity:.7}
  .counter{text-align:center; color:var(--sub); font-size:13px; margin-bottom:10px}

  .row-btns{display:flex; gap:10px}
  button.big{flex:1; padding:16px; border-radius:14px; border:none; font-size:15px; font-weight:600; cursor:pointer; color:#fff}
  .b-again{background:#3a2740; color:#ffb3b3; border:1px solid #5a2f45}
  .b-good{background:linear-gradient(135deg,var(--green),#2fae76); color:#06231a}
  .b-next{background:var(--accent2)}
  .b-speak{background:var(--panel2); color:var(--txt); border:1px solid var(--line); flex:0 0 56px; font-size:20px}

  /* dialogue */
  .bubble{max-width:82%; padding:12px 15px; border-radius:16px; margin-bottom:6px; line-height:1.5; font-size:15px}
  .b-a{background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px; align-self:flex-start}
  .b-b{background:linear-gradient(135deg,var(--accent2),#4a72d6); border-bottom-right-radius:4px; align-self:flex-end}
  .chat{display:flex; flex-direction:column; gap:2px; margin-bottom:16px}
  .who{font-size:11px; color:var(--sub); margin:8px 0 2px}
  .b-b .who{text-align:right}
  .line-jp{font-weight:600}
  .line-furi{font-size:12px; color:#cfe0ff; opacity:.85; margin:2px 0}
  .b-a .line-furi{color:var(--accent2)}
  .line-ko{font-size:13px; opacity:.9; margin-top:4px}
  .spk{cursor:pointer; margin-left:6px; opacity:.7; font-size:13px}

  /* quiz */
  .q-opt{display:block; width:100%; text-align:left; padding:15px; margin-bottom:10px; border-radius:12px; background:var(--panel); border:1px solid var(--line); color:var(--txt); font-size:16px; cursor:pointer; transition:.15s}
  .q-opt:active{transform:scale(.98)}
  .q-opt.correct{background:#123a2b; border-color:var(--green); color:#8ff0c8}
  .q-opt.wrong{background:#3a1620; border-color:var(--red); color:#ffb3b3}
  .q-prompt{font-size:34px; font-weight:700; text-align:center; margin:20px 0 6px}
  .q-sub{text-align:center; color:var(--sub); margin-bottom:24px; font-size:14px}
  .result{text-align:center; padding:30px 10px}
  .result .big-num{font-size:52px; font-weight:800; color:var(--gold)}

  /* kana grid */
  .kana-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
  .kana-cell{aspect-ratio:1; background:var(--panel); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer}
  .kana-cell b{font-size:22px}
  .kana-cell small{font-size:10px; color:var(--sub)}
  .kana-cell:active{background:var(--accent); color:#181018}

  /* bottom nav */
  nav{position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto; background:var(--panel); border-top:1px solid var(--line); display:flex; padding:8px 6px 12px}
  nav button{flex:1; background:none; border:none; color:var(--sub); font-size:11px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0}
  nav button .ni{font-size:20px}
  nav button.on{color:var(--accent)}

  .note{background:var(--panel); border:1px dashed var(--line); border-radius:12px; padding:14px; font-size:13px; color:var(--sub); line-height:1.6; margin-bottom:16px}
  .badge{display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:var(--panel2); color:var(--sub); border:1px solid var(--line); margin-left:6px}
</style>
</head>

function markStudied(n){
  const s=store.get(); const today=new Date().toISOString().slice(0,10);

  }
  store.set(s); renderStreak();
}
function yesterday(){ const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
function renderStreak(){ const s=store.get(); document.getElementById("streak").textContent="🔥 "+(s.streak||0)+"일"; }

/* ============================== 음성 (TTS) ============================== */
function speak(text){
  if(!("speechSynthesis" in window)) return;
  const u=new SpeechSynthesisUtterance(text); u.lang="ja-JP"; u.rate=.9;
  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith("ja"));
  if(v) u.voice=v;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ---- 퀴즈 ---- */
let quiz={q:0,score:0,items:[]};
function buildQuiz(){
  const all=[].concat(WORDS.friends,WORDS.daily,WORDS.kitchen);
  const shuffled=all.map(a=>[Math.random(),a]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]).slice(0,10);
  quiz={q:0,score:0,items:shuffled.map(w=>{
    const opts=[w.ko]; const pool=all.filter(x=>x.ko!==w.ko);
    while(opts.length<4){ const r=pool[Math.floor(Math.random()*pool.length)].ko; if(!opts.includes(r)) opts.push(r); }
    return {w, opts:opts.map(o=>[Math.random(),o]).sort((a,b)=>a[0]-b[0]).map(o=>o[1])};
  })};
}
function viewQuiz(){
  if(quiz.q>=quiz.items.length){ return quizResult(); }
  const it=quiz.items[quiz.q];
  main.innerHTML=`<div class="shead"><button class="back" onclick="go('home')">←</button>
    <div><h2>단어 퀴즈</h2><small>${quiz.q+1} / ${quiz.items.length} · 점수 ${quiz.score}</small></div></div>
    <div class="q-prompt">${esc(it.w.jp)}</div>
    <div class="q-sub">${it.w.furi} · 🔊 <span id="qs" style="cursor:pointer;text-decoration:underline">듣기</span></div>
    <div id="opts"></div>`;
  document.getElementById("qs").onclick=()=>speak(it.w.jp);
  const box=document.getElementById("opts");
  it.opts.forEach(o=>{
    const b=document.createElement("button"); b.className="q-opt"; b.textContent=o;
    b.onclick=()=>{
      if(b.dataset.done) return;
      box.querySelectorAll(".q-opt").forEach(x=>x.dataset.done=1);
      if(o===it.w.ko){ b.classList.add("correct"); quiz.score++; markStudied(1); }
      else{ b.classList.add("wrong"); box.querySelectorAll(".q-opt").forEach(x=>{if(x.textContent===it.w.ko)x.classList.add("correct");}); }
      setTimeout(()=>{quiz.q++;viewQuiz();},900);
    };
    box.appendChild(b);
  });
}
function quizResult(){
  main.innerHTML=`<div class="shead"><button class="back" onclick="go('home')">←</button><div><h2>결과</h2></div></div>
   <div class="result"><div class="big-num">${quiz.score}/${quiz.items.length}</div>
   <p style="color:var(--sub);margin:14px 0 24px">${quiz.score>=8?"훌륭해요! 🎉 다음 단계로!":quiz.score>=5?"좋아요, 조금만 더! 💪":"복습하고 다시 도전해요 📚"}</p>
   <div class="row-btns"><button class="big b-good" onclick="buildQuiz();viewQuiz()">다시 풀기</button>
   <button class="big b-next" onclick="go('words')">단어 복습</button></div></div>`;
}

/* ============================== 라우팅 ============================== */
function go(v){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.view===v || (v==="quiz"&&b.dataset.view==="home")));
  if(v==="home")viewHome();
  else if(v==="words")viewWords();
  else if(v==="grammar")viewGrammar();
  else if(v==="talk")viewTalk();
  else if(v==="kana")viewKana();
  else if(v==="quiz"){buildQuiz();viewQuiz();}
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.view));

go("home");
